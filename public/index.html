<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KEYBYPASS // Resolver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060a;
  --bg2:#0a0d16;
  --panel:rgba(13,17,28,.72);
  --stroke:rgba(0,255,224,.14);
  --stroke2:rgba(0,255,224,.35);
  --cyan:#00ffe0;
  --cyan-dim:#00b39d;
  --green:#00ff9d;
  --red:#ff3b6b;
  --txt:#dbe7f3;
  --muted:#6b7a90;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'JetBrains Mono',monospace;
  background:var(--bg);
  color:var(--txt);
  overflow-x:hidden;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 20px;
  position:relative;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 10%, rgba(0,255,224,.08), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(120,80,255,.08), transparent 45%),
    linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
  z-index:-3;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0,255,224,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,255,224,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%);
  z-index:-2;
  animation:gridPulse 8s ease-in-out infinite;
}
@keyframes gridPulse{0%,100%{opacity:.55}50%{opacity:.9}}
.scan{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(0,255,224,.015) 0 2px,transparent 2px 4px);
  z-index:1;
  mix-blend-mode:overlay;
}
.wrap{width:100%;max-width:820px;position:relative;z-index:2}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;padding:0 4px}
.brand-left{display:flex;align-items:center;gap:12px}
.logo{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,rgba(0,255,224,.2),rgba(120,80,255,.15));
  border:1px solid var(--stroke2);
  display:grid;place-items:center;
  box-shadow:0 0 24px rgba(0,255,224,.25) inset,0 0 18px rgba(0,255,224,.12);
  position:relative;
}
.logo::after{content:"";position:absolute;inset:9px;border:1.5px solid var(--cyan);border-radius:4px;animation:logoSpin 6s linear infinite}
@keyframes logoSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.title{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;letter-spacing:4px;color:#fff;text-shadow:0 0 14px rgba(0,255,224,.55)}
.title span{color:var(--cyan)}
.sub{font-size:10px;letter-spacing:3px;color:var(--muted);margin-top:2px}
.status{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2px;color:var(--green);padding:7px 12px;border:1px solid rgba(0,255,157,.25);border-radius:999px;background:rgba(0,255,157,.04)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.card{
  background:var(--panel);
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:26px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.02) inset,0 0 60px -10px rgba(0,255,224,.08);
  position:relative;
  overflow:hidden;
}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.5}
.label{font-size:10px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.input-row{position:relative;display:flex;align-items:center;background:#060810;border:1px solid var(--stroke);border-radius:12px;transition:.2s}
.input-row:focus-within{border-color:var(--stroke2);box-shadow:0 0 0 3px rgba(0,255,224,.08),0 0 24px -6px rgba(0,255,224,.35)}
.input-row .prefix{padding:0 12px 0 16px;color:var(--cyan-dim);font-size:13px;user-select:none;border-right:1px solid var(--stroke);height:26px;display:flex;align-items:center}
input[type=text]{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font-family:inherit;font-size:13.5px;padding:16px 14px;letter-spacing:.3px}
input::placeholder{color:#3d4a5e}
.btn{
  width:100%;margin-top:14px;padding:16px;
  border:1px solid var(--stroke2);border-radius:12px;
  background:linear-gradient(180deg,rgba(0,255,224,.14),rgba(0,255,224,.04));
  color:var(--cyan);font-family:'Orbitron',sans-serif;font-weight:800;
  letter-spacing:5px;font-size:13px;cursor:pointer;transition:.18s;
  position:relative;overflow:hidden;
}
.btn:hover{background:linear-gradient(180deg,rgba(0,255,224,.22),rgba(0,255,224,.08));box-shadow:0 0 28px -6px rgba(0,255,224,.6),0 0 0 1px rgba(0,255,224,.5);color:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn .spinner{display:none;width:14px;height:14px;border:2px solid rgba(0,255,224,.3);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:10px}
.btn.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.result{margin-top:20px;background:#060810;border:1px solid var(--stroke);border-radius:12px;min-height:120px;position:relative;overflow:hidden}
.result-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--stroke);font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
.result-body{padding:18px 16px;font-size:12.5px;line-height:1.7;color:var(--muted);word-break:break-all;min-height:78px;display:flex;align-items:center}
.result-body.ok{color:var(--cyan);text-shadow:0 0 12px rgba(0,255,224,.4)}
.result-body.err{color:var(--red)}
.result-body .caret{display:inline-block;width:8px;height:15px;background:var(--cyan);margin-left:4px;animation:blink 1s steps(2) infinite;vertical-align:-2px}
.actions{display:none;gap:8px;padding:0 14px 14px}
.actions.show{display:flex}
.act{flex:1;padding:11px;border-radius:9px;border:1px solid var(--stroke);background:transparent;color:var(--txt);font-family:inherit;font-size:11px;letter-spacing:2px;cursor:pointer;transition:.15s;text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.act:hover{border-color:var(--stroke2);color:var(--cyan);background:rgba(0,255,224,.05)}
.act.primary{background:linear-gradient(180deg,rgba(0,255,224,.15),rgba(0,255,224,.05));border-color:var(--stroke2);color:var(--cyan)}
.act.primary:hover{color:#fff}
.foot{margin-top:16px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#2f3a4d;padding:0 4px}
.foot span b{color:var(--muted);font-weight:500}
@media(max-width:560px){
  .brand{flex-direction:column;gap:12px;align-items:flex-start}
  .card{padding:20px;border-radius:14px}
  .title{font-size:18px;letter-spacing:3px}
  input[type=text]{font-size:12.5px}
}
</style>
</head>
<body>
<div class="scan"></div>
<div class="wrap">
  <div class="brand">
    <div class="brand-left">
      <div class="logo"></div>
      <div>
        <div class="title">KEY<span>BYPASS</span></div>
        <div class="sub">RESOLVER // v2.0</div>
      </div>
    </div>
    <div class="status"><span class="dot"></span>ONLINE</div>
  </div>

  <div class="card">
    <div class="label">Target Endpoint</div>
    <div class="input-row">
      <div class="prefix">›</div>
      <input id="target" type="text" placeholder="https://link-to.net/xxxxx atau link getkey lainnya..." autocomplete="off" spellcheck="false" />
    </div>

    <button class="btn" id="go"><span class="spinner"></span>BYPASS</button>

    <div class="result">
      <div class="result-head">
        <span>OUTPUT</span>
        <span id="provider">--</span>
      </div>
      <div class="result-body" id="out">Waiting for target input<span class="caret"></span></div>
      <div class="actions" id="acts">
        <button class="act" id="copy">COPY</button>
        <a class="act primary" id="open" target="_blank" rel="noopener">OPEN LINK</a>
      </div>
    </div>
  </div>

  <div class="foot">
    <span>NODE <b id="lat">--ms</b></span>
    <span>RESOLVED <b id="cnt">0</b></span>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let count = 0;

async function run(){
  const url = $('target').value.trim();
  if(!url){ pulse('err','No target provided.'); return; }

  $('go').classList.add('loading');
  $('go').disabled = true;
  $('acts').classList.remove('show');
  $('provider').textContent = 'RESOLVING...';
  pulse('info','Resolving chain...');

  const t0 = performance.now();
  try{
    const r = await fetch('/api/bypass',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url})
    });
    const data = await r.json();
    const dt = Math.round(performance.now() - t0);
    $('lat').textContent = dt + 'ms';

    if(!data.ok) throw new Error(data.error || 'Unknown error');

    $('provider').textContent = (data.provider || 'GENERIC').toUpperCase();
    pulse('ok', data.result);
    $('open').href = data.result;
    $('acts').classList.add('show');
    count++; $('cnt').textContent = count;
  }catch(e){
    $('provider').textContent = 'FAIL';
    pulse('err', e.message);
  }finally{
    $('go').classList.remove('loading');
    $('go').disabled = false;
  }
}

function pulse(kind, msg){
  const el = $('out');
  el.className = 'result-body ' + (kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : '');
  el.innerHTML = '';
  const txt = document.createElement('span');
  txt.textContent = msg;
  el.appendChild(txt);
  if(kind !== 'ok'){
    const c = document.createElement('span');
    c.className = 'caret';
    el.appendChild(c);
  }
}

$('go').addEventListener('click', run);
$('target').addEventListener('keydown', e => { if(e.key === 'Enter') run(); });

$('copy').addEventListener('click', async () => {
  const txt = $('out').textContent.replace(/\s+$/,'');
  try{
    await navigator.clipboard.writeText(txt);
    $('copy').textContent = 'COPIED';
    setTimeout(()=>$('copy').textContent='COPY',1200);
  }catch{}
});
</script>
</body>
</html>
